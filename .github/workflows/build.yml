name: Build Custom Headscale Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      manual_tag:
        description: 'Use custom tag for manual build'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/headscale-alpine

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Parse Headscale Version
        id: version
        run: |
          if [ -n "${{ inputs.manual_tag }}" ]; then
            TAG="${{ inputs.manual_tag }}"
          else
            TAG=$(grep -E 'ARG HEADSCALE_VERSION=' Dockerfile | cut -d'=' -f2)
          fi
          echo "HEADSCALE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Build image for ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            HEADSCALE_VERSION=${{ env.HEADSCALE_TAG }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.HEADSCALE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.HEADSCALE_TAG }}
          name: Release ${{ env.HEADSCALE_TAG }}
          body: |
            ## Custom Headscale Image with Shell (${{ env.HEADSCALE_TAG }})

            Automated release of a custom Alpine-based Headscale image.

            **Docker Image:**
            `ghcr.io/${{ env.IMAGE_NAME }}:${{ env.HEADSCALE_TAG }}`
          draft: false
          prerelease: false
